name: Portable Linux smoke tests
on:
  push:
    branches: [main, v2.9]
  pull_request:

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bash syntax
        run: bash -n fido2-guard.sh
      - name: Python compilation
        run: python -m py_compile fido-platform.py fido-status.py fido-tui.py fido-hotplug.py fido-kde-x11-retry.py fido-insertion-watch.py fido-removal-guard.py
      - name: Run hardware-free tests
        run: python -m unittest discover -s tests -v
